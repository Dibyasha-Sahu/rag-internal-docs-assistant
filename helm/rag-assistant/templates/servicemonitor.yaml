apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rag-assistant-api
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - rag-assistant
  selector:
    matchLabels:
      app: rag-assistant-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
