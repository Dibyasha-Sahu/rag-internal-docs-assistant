services:
  api:
    image: rag-docs-assistant:1.2
    container_name: rag-docs-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped

  ui:
    image: rag-docs-assistant:1.2
    container_name: rag-docs-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - api
    command: >
      streamlit run ui/streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501
    restart: unless-stopped